version: '3.8'

services:
  base:
    network_mode: host
    security_opt:
      - no-new-privileges:false
    build:
      context: ws/.devcontainer/
      args:
        USERNAME: "${USERNAME}"
        ROS_DIS: "${ROS_DIS}"
    volumes:
      - .:/home/jtsn/
      # Монтируем X11 сокет для графических приложений
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Монтируем директорию с авторизацией X11
      - ~/.Xauthority:/home/jtsn/.Xauthority:rw
    environment:
      # Устанавливаем DISPLAY для вывода графики
      - DISPLAY=${DISPLAY}
      # QT_GRAPHICSSYSTEM для совместимости с Qt приложениями
      - QT_GRAPHICSSYSTEM=native
    stdin_open: true
    tty: true